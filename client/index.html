<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Deliberately NO viewport-fit=cover.

      In an installed iOS Home Screen app, `cover` anchors the web view at the top
      of the display but does not give it the display's HEIGHT: the viewport ends
      one status-bar short, leaving a black band under the bottom bar that no CSS
      can paint. Without `cover`, iOS sizes the web view to the safe area and
      fills the surrounding region by extending the page's own edge colour, so the
      bar visually reaches the screen edge. Measured on an iPhone 14 — and a
      Safari tab cannot reproduce it, only a Home Screen install can.

      maximum-scale is NOT set: it would block pinch-zoom, which people rely on.
      Input zoom-on-focus is prevented the correct way instead, by keeping every
      field at 16px.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Birthday Bot</title>
    <meta name="description" content="Every birthday you care about, with a reminder at 8:00 AM on the day." />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" />

    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#f5f6f4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1214" media="(prefers-color-scheme: dark)" />

    <!-- Without apple-mobile-web-app-capable an installed iOS PWA letterboxes and
         every safe-area inset reads 0. The modern `mobile-web-app-capable` does
         not cover iOS on its own. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- Not the lever for the dead band (black and black-translucent both measured
         identical); "default" keeps the status bar legible on the light ground. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Birthdays" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" href="/icons/icon-192.png" type="image/png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
