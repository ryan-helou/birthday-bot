# Pin the Node major so a Railway image refresh can't silently move it.
# `npm ci` here installs devDependencies too, which the client build needs
# (vite, tailwind, react); the Prisma CLI is a regular dependency because
# `npm start` runs `prisma migrate deploy` at boot.
[phases.setup]
nixPkgs = ["nodejs_20"]

[phases.install]
cmds = ["npm ci --include=dev"]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "npm run start"
